openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: TG Restaurant ERP API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: branches
  - name: users
  - name: menu
  - name: orders
  - name: kitchen
  - name: deliveries
  - name: customers
  - name: finance
  - name: inventory
  - name: payroll
  - name: lottery
  - name: dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  # ─── BRANCHES ─────────────────────────────────────────────
  /branches:
    get:
      operationId: listBranches
      tags: [branches]
      summary: List all branches
      responses:
        "200":
          description: Branch list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
    post:
      operationId: createBranch
      tags: [branches]
      summary: Create branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"

  /branches/{id}:
    get:
      operationId: getBranch
      tags: [branches]
      summary: Get branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
    patch:
      operationId: updateBranch
      tags: [branches]
      summary: Update branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
    delete:
      operationId: deleteBranch
      tags: [branches]
      summary: Delete branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── USERS ────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List staff users
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
        - name: role
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create staff user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── MENU CATEGORIES ──────────────────────────────────────
  /menu/categories:
    get:
      operationId: listMenuCategories
      tags: [menu]
      summary: List menu categories
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuCategory"
    post:
      operationId: createMenuCategory
      tags: [menu]
      summary: Create menu category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuCategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuCategory"

  /menu/categories/{id}:
    patch:
      operationId: updateMenuCategory
      tags: [menu]
      summary: Update menu category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuCategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuCategory"
    delete:
      operationId: deleteMenuCategory
      tags: [menu]
      summary: Delete menu category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── MENU ITEMS ───────────────────────────────────────────
  /menu/items:
    get:
      operationId: listMenuItems
      tags: [menu]
      summary: List menu items
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: available
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: createMenuItem
      tags: [menu]
      summary: Create menu item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"

  /menu/items/{id}:
    get:
      operationId: getMenuItem
      tags: [menu]
      summary: Get menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
    patch:
      operationId: updateMenuItem
      tags: [menu]
      summary: Update menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
    delete:
      operationId: deleteMenuItem
      tags: [menu]
      summary: Delete menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── ORDERS ───────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/by-code/{code}:
    get:
      operationId: getOrderByCode
      tags: [orders]
      summary: Get order by code (customer tracking)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found

  # ─── KITCHEN ──────────────────────────────────────────────
  /kitchen/queue:
    get:
      operationId: getKitchenQueue
      tags: [kitchen]
      summary: Get kitchen order queue
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Kitchen queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KitchenTicket"

  /kitchen/orders/{id}/start:
    patch:
      operationId: startPreparingOrder
      tags: [kitchen]
      summary: Mark order as preparing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /kitchen/orders/{id}/ready:
    patch:
      operationId: markOrderReady
      tags: [kitchen]
      summary: Mark order as ready
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ─── DELIVERIES ───────────────────────────────────────────
  /deliveries:
    get:
      operationId: listDeliveries
      tags: [deliveries]
      summary: List deliveries
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
        - name: staffId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
    post:
      operationId: createDelivery
      tags: [deliveries]
      summary: Create delivery assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"

  /deliveries/{id}:
    get:
      operationId: getDelivery
      tags: [deliveries]
      summary: Get delivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
    patch:
      operationId: updateDelivery
      tags: [deliveries]
      summary: Update delivery status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"

  # ─── CUSTOMERS ────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  # ─── FINANCE ──────────────────────────────────────────────
  /finance/expenses:
    get:
      operationId: listExpenses
      tags: [finance]
      summary: List expenses
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [finance]
      summary: Log expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /finance/expenses/{id}:
    delete:
      operationId: deleteExpense
      tags: [finance]
      summary: Delete expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /finance/summary:
    get:
      operationId: getFinanceSummary
      tags: [finance]
      summary: Get financial summary (income, expenses, profit)
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"

  /finance/revenue-trend:
    get:
      operationId: getRevenueTrend
      tags: [finance]
      summary: Daily revenue trend for chart
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
        - name: days
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Revenue trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenueTrendPoint"

  # ─── INVENTORY ────────────────────────────────────────────
  /inventory:
    get:
      operationId: listInventoryItems
      tags: [inventory]
      summary: List inventory items
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
        - name: lowStock
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Create inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /inventory/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Delete inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /inventory/waste:
    get:
      operationId: listWasteLogs
      tags: [inventory]
      summary: List waste logs
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Waste logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WasteLog"
    post:
      operationId: createWasteLog
      tags: [inventory]
      summary: Log waste
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WasteLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WasteLog"

  # ─── PAYROLL ──────────────────────────────────────────────
  /payroll/timesheets:
    get:
      operationId: listTimesheets
      tags: [payroll]
      summary: List timesheets
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: branchId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Timesheets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Timesheet"
    post:
      operationId: createTimesheet
      tags: [payroll]
      summary: Clock in / clock out entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimesheetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timesheet"

  /payroll/timesheets/{id}:
    patch:
      operationId: updateTimesheet
      tags: [payroll]
      summary: Update timesheet (clock out)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimesheetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timesheet"

  /payroll/payslips:
    get:
      operationId: listPayslips
      tags: [payroll]
      summary: List payslips
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: branchId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Payslips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payslip"
    post:
      operationId: generatePayslip
      tags: [payroll]
      summary: Generate payslip for a period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayslipInput"
      responses:
        "201":
          description: Generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payslip"

  /payroll/commissions:
    get:
      operationId: listCommissions
      tags: [payroll]
      summary: List commission records
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Commissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Commission"

  # ─── LOTTERY ──────────────────────────────────────────────
  /lottery/draws:
    get:
      operationId: listLotteryDraws
      tags: [lottery]
      summary: List lottery draws
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Draws
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LotteryDraw"
    post:
      operationId: createLotteryDraw
      tags: [lottery]
      summary: Create lottery draw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LotteryDrawInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotteryDraw"

  /lottery/draws/{id}/run:
    post:
      operationId: runLotteryDraw
      tags: [lottery]
      summary: Run lottery draw (pick winners)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Draw results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotteryResult"

  /lottery/draws/{id}/winners:
    get:
      operationId: getLotteryWinners
      tags: [lottery]
      summary: Get winners for a draw
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Winners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LotteryWinner"

  # ─── DASHBOARD ────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Super admin command center summary
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/live-orders:
    get:
      operationId: getLiveOrders
      tags: [dashboard]
      summary: Live active orders across branches
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Live orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Alerts (low stock, delayed orders, failed deliveries)
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /dashboard/top-items:
    get:
      operationId: getTopMenuItems
      tags: [dashboard]
      summary: Top selling menu items
      parameters:
        - name: branchId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Top items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopMenuItem"

  /dashboard/branch-stats:
    get:
      operationId: getBranchStats
      tags: [dashboard]
      summary: Per-branch stats comparison
      responses:
        "200":
          description: Branch stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BranchStat"

# ─── SCHEMAS ──────────────────────────────────────────────────
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # AUTH
    LoginInput:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # BRANCH
    Branch:
      type: object
      required: [id, name, address, phone, active, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        active:
          type: boolean
        createdAt:
          type: string

    BranchInput:
      type: object
      required: [name, address, phone]
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        active:
          type: boolean

    BranchUpdate:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        active:
          type: boolean

    # USER
    User:
      type: object
      required: [id, name, phone, role, active, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [super_admin, branch_manager, kitchen_staff, delivery_staff, order_staff, addis_staff, finance_staff]
        branchId:
          type: ["integer", "null"]
        baseSalary:
          type: ["number", "null"]
        active:
          type: boolean
        createdAt:
          type: string

    UserInput:
      type: object
      required: [name, phone, role, password]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [super_admin, branch_manager, kitchen_staff, delivery_staff, order_staff, addis_staff, finance_staff]
        branchId:
          type: integer
        baseSalary:
          type: number

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        role:
          type: string
        branchId:
          type: ["integer", "null"]
        baseSalary:
          type: ["number", "null"]
        active:
          type: boolean

    # MENU
    MenuCategory:
      type: object
      required: [id, nameEn, nameAm, sortOrder]
      properties:
        id:
          type: integer
        branchId:
          type: ["integer", "null"]
        nameEn:
          type: string
        nameAm:
          type: string
        sortOrder:
          type: integer

    MenuCategoryInput:
      type: object
      required: [nameEn, nameAm]
      properties:
        branchId:
          type: integer
        nameEn:
          type: string
        nameAm:
          type: string
        sortOrder:
          type: integer

    MenuCategoryUpdate:
      type: object
      properties:
        nameEn:
          type: string
        nameAm:
          type: string
        sortOrder:
          type: integer

    MenuItem:
      type: object
      required: [id, categoryId, nameEn, nameAm, priceAed, available]
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        nameEn:
          type: string
        nameAm:
          type: string
        description:
          type: ["string", "null"]
        priceAed:
          type: number
        photoUrl:
          type: ["string", "null"]
        available:
          type: boolean
        categoryName:
          type: ["string", "null"]

    MenuItemInput:
      type: object
      required: [categoryId, nameEn, nameAm, priceAed]
      properties:
        categoryId:
          type: integer
        nameEn:
          type: string
        nameAm:
          type: string
        description:
          type: string
        priceAed:
          type: number
        photoUrl:
          type: string
        available:
          type: boolean

    MenuItemUpdate:
      type: object
      properties:
        nameEn:
          type: string
        nameAm:
          type: string
        description:
          type: string
        priceAed:
          type: number
        photoUrl:
          type: ["string", "null"]
        available:
          type: boolean
        categoryId:
          type: integer

    # ORDERS
    OrderItem:
      type: object
      required: [id, menuItemId, quantity, unitPrice]
      properties:
        id:
          type: integer
        menuItemId:
          type: integer
        menuItemName:
          type: ["string", "null"]
        quantity:
          type: integer
        unitPrice:
          type: number
        notes:
          type: ["string", "null"]

    OrderItemInput:
      type: object
      required: [menuItemId, quantity, unitPrice]
      properties:
        menuItemId:
          type: integer
        quantity:
          type: integer
        unitPrice:
          type: number
        notes:
          type: string

    Order:
      type: object
      required: [id, orderCode, branchId, status, totalAed, channel, createdAt]
      properties:
        id:
          type: integer
        orderCode:
          type: string
        branchId:
          type: integer
        branchName:
          type: ["string", "null"]
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        customerPhone:
          type: ["string", "null"]
        channel:
          type: string
          enum: [whatsapp, whatsapp_relay, whatsapp_voice, webapp, manual]
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, out_for_delivery, delivered, cancelled]
        totalAed:
          type: number
        paymentMethod:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string

    OrderInput:
      type: object
      required: [branchId, items]
      properties:
        branchId:
          type: integer
        customerId:
          type: integer
        channel:
          type: string
          enum: [whatsapp, whatsapp_relay, whatsapp_voice, webapp, manual]
        paymentMethod:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"

    OrderUpdate:
      type: object
      properties:
        paymentMethod:
          type: string
        customerId:
          type: ["integer", "null"]

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, out_for_delivery, delivered, cancelled]

    KitchenTicket:
      type: object
      required: [id, orderCode, status, createdAt, items]
      properties:
        id:
          type: integer
        orderCode:
          type: string
        status:
          type: string
        elapsedMinutes:
          type: integer
        customerName:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string

    # DELIVERY
    Delivery:
      type: object
      required: [id, orderId, deliveryStatus]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        orderCode:
          type: ["string", "null"]
        deliveryStaffId:
          type: ["integer", "null"]
        staffName:
          type: ["string", "null"]
        pickedUpAt:
          type: ["string", "null"]
        deliveredAt:
          type: ["string", "null"]
        deliveryStatus:
          type: string
          enum: [assigned, picked_up, delivered, failed]
        amountCollected:
          type: ["number", "null"]
        gpsLocation:
          type: ["string", "null"]
        customerName:
          type: ["string", "null"]
        customerPhone:
          type: ["string", "null"]
        createdAt:
          type: string

    DeliveryInput:
      type: object
      required: [orderId]
      properties:
        orderId:
          type: integer
        deliveryStaffId:
          type: integer

    DeliveryUpdate:
      type: object
      properties:
        deliveryStatus:
          type: string
          enum: [assigned, picked_up, delivered, failed]
        amountCollected:
          type: number
        gpsLocation:
          type: string
        deliveryStaffId:
          type: integer

    # CUSTOMER
    Customer:
      type: object
      required: [id, name, phone, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        whatsappId:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        totalOrders:
          type: ["integer", "null"]
        totalSpent:
          type: ["number", "null"]
        createdAt:
          type: string

    CustomerInput:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
        phone:
          type: string
        whatsappId:
          type: string
        address:
          type: string

    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        address:
          type: ["string", "null"]

    # FINANCE
    Expense:
      type: object
      required: [id, branchId, category, amountAed, description, createdAt]
      properties:
        id:
          type: integer
        branchId:
          type: integer
        category:
          type: string
        amountAed:
          type: number
        description:
          type: string
        loggedBy:
          type: ["integer", "null"]
        loggedByName:
          type: ["string", "null"]
        createdAt:
          type: string

    ExpenseInput:
      type: object
      required: [branchId, category, amountAed, description]
      properties:
        branchId:
          type: integer
        category:
          type: string
        amountAed:
          type: number
        description:
          type: string

    FinanceSummary:
      type: object
      required: [totalRevenue, totalExpenses, netProfit, orderCount]
      properties:
        totalRevenue:
          type: number
        totalExpenses:
          type: number
        netProfit:
          type: number
        orderCount:
          type: integer
        avgOrderValue:
          type: number
        branchId:
          type: ["integer", "null"]
        from:
          type: ["string", "null"]
        to:
          type: ["string", "null"]

    RevenueTrendPoint:
      type: object
      required: [date, revenue, orderCount]
      properties:
        date:
          type: string
        revenue:
          type: number
        orderCount:
          type: integer

    # INVENTORY
    InventoryItem:
      type: object
      required: [id, branchId, name, unit, quantityOnHand, reorderThreshold]
      properties:
        id:
          type: integer
        branchId:
          type: integer
        name:
          type: string
        unit:
          type: string
        quantityOnHand:
          type: number
        reorderThreshold:
          type: number
        supplier:
          type: ["string", "null"]
        isLowStock:
          type: boolean

    InventoryItemInput:
      type: object
      required: [branchId, name, unit, quantityOnHand, reorderThreshold]
      properties:
        branchId:
          type: integer
        name:
          type: string
        unit:
          type: string
        quantityOnHand:
          type: number
        reorderThreshold:
          type: number
        supplier:
          type: string

    InventoryItemUpdate:
      type: object
      properties:
        name:
          type: string
        unit:
          type: string
        quantityOnHand:
          type: number
        reorderThreshold:
          type: number
        supplier:
          type: ["string", "null"]

    WasteLog:
      type: object
      required: [id, branchId, ingredientId, quantity, reason, createdAt]
      properties:
        id:
          type: integer
        branchId:
          type: integer
        ingredientId:
          type: integer
        ingredientName:
          type: ["string", "null"]
        quantity:
          type: number
        reason:
          type: string
        loggedBy:
          type: ["integer", "null"]
        createdAt:
          type: string

    WasteLogInput:
      type: object
      required: [branchId, ingredientId, quantity, reason]
      properties:
        branchId:
          type: integer
        ingredientId:
          type: integer
        quantity:
          type: number
        reason:
          type: string

    # PAYROLL
    Timesheet:
      type: object
      required: [id, userId, branchId, clockIn]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: ["string", "null"]
        branchId:
          type: integer
        clockIn:
          type: string
        clockOut:
          type: ["string", "null"]
        hoursWorked:
          type: ["number", "null"]

    TimesheetInput:
      type: object
      required: [userId, branchId, clockIn]
      properties:
        userId:
          type: integer
        branchId:
          type: integer
        clockIn:
          type: string
        clockOut:
          type: string

    TimesheetUpdate:
      type: object
      properties:
        clockOut:
          type: string

    Payslip:
      type: object
      required: [id, userId, baseSalary, netPay, generatedAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: ["string", "null"]
        periodStart:
          type: string
        periodEnd:
          type: string
        baseSalary:
          type: number
        commissionTotal:
          type: number
        overtimeTotal:
          type: number
        deductions:
          type: number
        netPay:
          type: number
        generatedAt:
          type: string

    PayslipInput:
      type: object
      required: [userId, periodStart, periodEnd]
      properties:
        userId:
          type: integer
        periodStart:
          type: string
        periodEnd:
          type: string

    Commission:
      type: object
      required: [id, userId, orderId, amountAed, type, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        orderId:
          type: integer
        amountAed:
          type: number
        type:
          type: string
        createdAt:
          type: string

    # LOTTERY
    LotteryDraw:
      type: object
      required: [id, branchId, drawDate, status]
      properties:
        id:
          type: integer
        branchId:
          type: integer
        drawDate:
          type: string
        eligiblePool:
          type: integer
        status:
          type: string
          enum: [scheduled, completed, cancelled]
        winnersCount:
          type: ["integer", "null"]

    LotteryDrawInput:
      type: object
      required: [branchId, drawDate]
      properties:
        branchId:
          type: integer
        drawDate:
          type: string
        winnersCount:
          type: integer

    LotteryResult:
      type: object
      required: [drawId, winners]
      properties:
        drawId:
          type: integer
        winners:
          type: array
          items:
            $ref: "#/components/schemas/LotteryWinner"

    LotteryWinner:
      type: object
      required: [id, drawId, ticketNumber, prize, notified]
      properties:
        id:
          type: integer
        drawId:
          type: integer
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        customerPhone:
          type: ["string", "null"]
        ticketNumber:
          type: string
        prize:
          type: string
        notified:
          type: boolean

    # DASHBOARD
    DashboardSummary:
      type: object
      required: [todayOrders, todayRevenue, activeDeliveries, pendingKitchen, lowStockAlerts]
      properties:
        todayOrders:
          type: integer
        todayRevenue:
          type: number
        activeDeliveries:
          type: integer
        pendingKitchen:
          type: integer
        lowStockAlerts:
          type: integer
        avgPrepMinutes:
          type: ["number", "null"]
        avgDeliveryMinutes:
          type: ["number", "null"]
        lotteryDrawToday:
          type: boolean
        onlineStaff:
          type: integer

    Alert:
      type: object
      required: [id, type, severity, message, branchId, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [low_stock, delayed_order, failed_delivery, system]
        severity:
          type: string
          enum: [info, warning, critical]
        message:
          type: string
        branchId:
          type: integer
        branchName:
          type: ["string", "null"]
        createdAt:
          type: string

    TopMenuItem:
      type: object
      required: [menuItemId, nameEn, totalSold, totalRevenue]
      properties:
        menuItemId:
          type: integer
        nameEn:
          type: string
        nameAm:
          type: ["string", "null"]
        totalSold:
          type: integer
        totalRevenue:
          type: number
        photoUrl:
          type: ["string", "null"]

    BranchStat:
      type: object
      required: [branchId, branchName, todayOrders, todayRevenue, activeStaff]
      properties:
        branchId:
          type: integer
        branchName:
          type: string
        todayOrders:
          type: integer
        todayRevenue:
          type: number
        activeStaff:
          type: integer
        pendingOrders:
          type: integer
