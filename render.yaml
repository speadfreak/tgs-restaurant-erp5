services:
  # ── Backend API (Express + Socket.IO) ──────────────────────────────────────
  - type: web
    name: tgs-restaurant-api
    runtime: node
    rootDir: artifacts/api-server
    # Keep the Render/Neon schema aligned before bundling the API. This is
    # required for newly-added tables and columns such as the streak engine.
    buildCommand: cd ../.. && pnpm install --frozen-lockfile && pnpm db:push && pnpm --filter @workspace/api-server run build
    # Also run the schema sync at boot so an existing Render service whose
    # dashboard command predates render.yaml still gets the streak tables.
    startCommand: cd ../.. && pnpm db:push && node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string in the Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false          # set to your static-site URL after the frontend is deployed
      - key: SESSION_SECRET
        sync: false          # fallback used by JWT signing if JWT_SECRET is unset (see Task #2)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false          # format: whatsapp:+1XXXXXXXXXX
      - key: LOG_LEVEL
        value: info          # optional: debug | info | warn | error

  # ── Frontend (React + Vite → static site) ──────────────────────────────────
  - type: static
    name: tgs-restaurant-web
    rootDir: artifacts/tg-erp
    buildCommand: cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @workspace/tg-erp run build
    staticPublishPath: dist/public   # matches vite.config.ts build.outDir
    envVars:
      - key: VITE_API_URL
        sync: false          # set to your API service URL, e.g. https://tgs-restaurant-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html    # required for React Router — avoids 404 on direct navigation
